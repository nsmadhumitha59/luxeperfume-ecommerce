{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | LUXEPERFUME</title>

    <link rel="stylesheet"
          href="{% static 'shop/css/style.css' %}">

</head>

<body>


<div class="auth-page">

    <div class="auth-box">

        <h1>
            LUXEPERFUME
        </h1>

        <h2>
            Welcome Back
        </h2>

        <p>
            Sign in to your account
        </p>


        <form>

            <input
                type="email"
                placeholder="Email Address"
                required
            >

            <input
                type="password"
                placeholder="Password"
                required
            >

            <button>
                LOGIN
            </button>

        </form>


        <p>
            Don't have an account?
        </p>

        <a href="{% url 'register' %}">
            Create Account
        </a>

    </div>

</div>


</body>

</html>
