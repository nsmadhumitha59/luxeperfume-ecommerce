{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register | LUXEPERFUME</title>

    <link rel="stylesheet"
          href="{% static 'shop/css/style.css' %}">

</head>

<body>


<div class="auth-page">

    <div class="auth-box">

        <h1>
            LUXEPERFUME
        </h1>

        <h2>
            Create Your Account
        </h2>

        <p>
            Join our fragrance community
        </p>


        <form>

            <input
                type="text"
                placeholder="Full Name"
                required
            >

            <input
                type="email"
                placeholder="Email Address"
                required
            >

            <input
                type="password"
                placeholder="Password"
                required
            >

            <input
                type="password"
                placeholder="Confirm Password"
                required
            >

            <button>
                CREATE ACCOUNT
            </button>

        </form>


        <p>
            Already have an account?
        </p>

        <a href="{% url 'login' %}">
            Login
        </a>

    </div>

</div>


</body>

</html>
